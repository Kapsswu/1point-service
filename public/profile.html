<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1 Point - Profile</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="top-nav">
    <a href="index.html" class="logo" style="text-decoration: none;">
      <div style="text-align: center; line-height: 1;">
        <div style="font-size: 2.2rem; font-weight: bold; color: var(--primary);">1</div>
        <div style="font-size: 0.95rem; color: var(--light);">Point.</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="auth.html" id="signin-link">Sign In</a>
      <a href="profile.html" id="profile-icon" style="display: none;">
        <img src="image/profile-icon.png" alt="Profile" style="width: 30px; height: 30px; border-radius: 50%;" />
      </a>
      <a href="#">Download 1 Point App</a>
    </div>
  </header>

  <main class="profile-container">
    <h1>Your Profile</h1>

    <section class="profile-info" id="profile-info">
      <p>Loading your profile...</p>
    </section>

    <section class="booking-history">
      <h2>Booking History</h2>
      <ul id="booking-list">
        <li>Loading bookings...</li>
      </ul>
    </section>

    <button onclick="logout()">Logout</button>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About Us</a>
      <a href="terms.html">Terms</a>
      <a href="registration.html">Registration</a>
      <a href="contact.html">Contact Us</a>
      <a href="review.html">Reviews</a>
    </div>
    <div class="social">
      <p>Follow us:</p>
      <a href="https://www.instagram.com/az_service_dimapur" target="_blank">Instagram</a>
      <a href="https://wa.me/916009982567" target="_blank">WhatsApp</a>
      <a href="#" id="fb-link">Facebook</a>
    </div>
  </footer>

  <!-- WhatsApp Button -->
  <a href="https://wa.me/916009982567" class="floating-whatsapp" target="_blank">
    <img src="image/whatsapp-icon.png" alt="Chat on WhatsApp" />
  </a>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIjDHdyokcHvzfzsAc5kK0tBaJxpKBwgY",
      authDomain: "point-service-c2fcb.firebaseapp.com",
      projectId: "point-service-c2fcb",
      storageBucket: "point-service-c2fcb.appspot.com",
      messagingSenderId: "77473043188",
      appId: "1:77473043188:web:8dc46646d5237291c6c4a1",
      measurementId: "G-MTVG8TYHDG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let currentUserEmail = null;

    // Load profile and bookings
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }
      currentUserId = user.uid;
      currentUserEmail = user.email;

      // Load profile info
      try {
        const userRef = doc(db, "users", currentUserId);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const data = userSnap.data();
          showProfile(data);
        } else {
          document.getElementById("profile-info").innerHTML = "<p>No profile found.</p>";
        }
      } catch (error) {
        console.error(error);
        document.getElementById("profile-info").innerHTML = "<p>Error loading profile.</p>";
      }

      // Load booking history
      loadBookingHistory();
    });

    // Show profile details
    function showProfile(data) {
      const profileInfo = document.getElementById("profile-info");
      profileInfo.innerHTML = `
        <p><strong>Name:</strong> ${data.firstName || ''} ${data.lastName || ''}</p>
        <p><strong>Email:</strong> ${currentUserEmail || ''}</p>
        <p><strong>Phone:</strong> ${data.phone || 'N/A'}</p>
        <p><strong>Address:</strong> ${data.address || 'N/A'}</p>
        <p><strong>Occupation:</strong> ${data.occupation || 'N/A'}</p>
        <button onclick="editProfile()">Edit Profile</button>
      `;
    }

    // Load booking history from Firestore
    async function loadBookingHistory() {
      const list = document.getElementById("booking-list");
      list.innerHTML = "<li>Loading...</li>";

      try {
        const q = query(collection(db, "users", currentUserId, "bookings"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        list.innerHTML = "";
        if (snapshot.empty) {
          list.innerHTML = "<li>No booking history yet.</li>";
        } else {
          snapshot.forEach(docSnap => {
            const b = docSnap.data();
            list.innerHTML += `<li>${b.service} - ${b.preferredTime || 'No date'} - ${b.status}</li>`;
          });
        }
      } catch (error) {
        console.error("Error loading bookings:", error);
        list.innerHTML = "<li>Error loading bookings.</li>";
      }
    }

    // Edit profile form
    window.editProfile = () => {
      const profileInfo = document.getElementById("profile-info");
      profileInfo.innerHTML = `
        <p><strong>First Name:</strong> <input id="edit-fname" /></p>
        <p><strong>Last Name:</strong> <input id="edit-lname" /></p>
        <p><strong>Phone:</strong> <input id="edit-phone" /></p>
        <p><strong>Address:</strong> <input id="edit-address" /></p>
        <p><strong>Occupation:</strong> <input id="edit-occupation" /></p>
        <button onclick="saveProfile()">Save</button>
      `;
    };

    // Save profile to Firestore
    window.saveProfile = async () => {
      try {
        const updates = {
          firstName: document.getElementById("edit-fname").value.trim(),
          lastName: document.getElementById("edit-lname").value.trim(),
          phone: document.getElementById("edit-phone").value.trim(),
          address: document.getElementById("edit-address").value.trim(),
          occupation: document.getElementById("edit-occupation").value.trim()
        };
        await updateDoc(doc(db, "users", currentUserId), updates);
        alert("✅ Profile updated!");
        window.location.reload();
      } catch (error) {
        console.error(error);
        alert("❌ Failed to update profile.");
      }
    };

    // Logout
    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "auth.html";
      });
    };
  </script>
</body>
</html>
