<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        .info {
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>User Profile</h2>
    <div id="userInfo">Loading...</div>
</div>

<script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // ✅ Your Firebase Config from ZIP
   const firebaseConfig = {
  apiKey: "AIzaSyBIjDHdyokcHvzfzsAc5kK0tBaJxpKBwgY",
  authDomain: "point-service-c2fcb.firebaseapp.com",
  projectId: "point-service-c2fcb",
  storageBucket: "point-service-c2fcb.firebasestorage.app",
  messagingSenderId: "77473043188",
  appId: "1:77473043188:web:8dc46646d5237291c6c4a1",
  measurementId: "G-MTVG8TYHDG"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Load User Profile
    onAuthStateChanged(auth, async (user) => {
        const userInfoDiv = document.getElementById("userInfo");
        if (user) {
            try {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    userInfoDiv.innerHTML = `
                        <div class="info"><span class="label">Name:</span> ${data.name || "N/A"}</div>
                        <div class="info"><span class="label">Email:</span> ${data.email || "N/A"}</div>
                        <div class="info"><span class="label">Phone:</span> ${data.phone || "N/A"}</div>
                    `;
                } else {
                    userInfoDiv.innerHTML = "No profile found in database.";
                }
            } catch (error) {
                console.error(error);
                userInfoDiv.innerHTML = "Error loading profile.";
            }
        } else {
            userInfoDiv.innerHTML = "No user is logged in.";
        }
    });
</script>
</body>
</html>
