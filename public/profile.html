<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1 Point - Your Profile</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .profile-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      background: #fff;
      font-family: Arial, sans-serif;
    }
    .profile-info p {
      margin-bottom: 0.75rem;
    }
    .profile-info label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .profile-info input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .profile-info button {
      margin-top: 1rem;
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    #save-btn {
      background: #28a745;
      color: #fff;
      margin-right: 12px;
      transition: background-color 0.3s ease;
    }
    #save-btn:hover {
      background: #218838;
    }
    #cancel-btn {
      background: #6c757d;
      color: #fff;
      transition: background-color 0.3s ease;
    }
    #cancel-btn:hover {
      background: #5a6268;
    }
    .spinner {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary, #007bff);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .booking-history ul {
      list-style: none;
      padding-left: 0;
    }
    .booking-history li {
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
    }
    /* Responsive */
    @media (max-width: 640px) {
      .profile-container {
        margin: 1rem;
        padding: 1rem;
      }
      .profile-info button {
        width: 100%;
        margin: 0.5rem 0;
      }
      #save-btn {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="top-nav">
    <a href="index.html" class="logo" style="text-decoration: none;">
      <div style="text-align: center; line-height: 1;">
        <div style="font-size: 2.2rem; font-weight: bold; color: var(--primary);">1</div>
        <div style="font-size: 0.95rem; color: var(--light);">Point.</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="auth.html" id="signin-link">Sign In</a>
      <a href="profile.html" id="profile-icon" style="display: none;">
        <img src="image/profile-icon.png" alt="Profile" style="width: 30px; height: 30px; border-radius: 50%;" />
      </a>
      <a href="#">Download 1 Point App</a>
    </div>
  </header>

  <main class="profile-container">
    <h1>Your Profile</h1>

    <section class="profile-info" id="profile-info">
      <div class="spinner" aria-label="Loading"></div>
      <p>Loading your profile...</p>
    </section>

    <section class="booking-history">
      <h2>Booking History</h2>
      <ul id="booking-list">
        <!-- Placeholder: dynamic booking history will go here -->
        <li>🛠️ Technician - 12 June 2025 - Completed</li>
        <li>🚗 Car Repair - 15 June 2025 - Pending</li>
      </ul>
    </section>

    <button onclick="logout()">Logout</button>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About Us</a>
      <a href="terms.html">Terms</a>
      <a href="registration.html">Registration</a>
      <a href="contact.html">Contact Us</a>
      <a href="review.html">Reviews</a>
    </div>
    <div class="social">
      <p>Follow us:</p>
      <a href="https://www.instagram.com/az_service_dimapur" target="_blank">Instagram</a>
      <a href="https://wa.me/916009982567" target="_blank">WhatsApp</a>
      <a href="#" id="fb-link">Facebook</a>
    </div>
  </footer>

  <a href="https://wa.me/916009982567" class="floating-whatsapp" target="_blank">
    <img src="image/whatsapp-icon.png" alt="Chat on WhatsApp" />
  </a>

  <!-- Firebase Profile Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIjDHdyokcHvzfzsAc5kK0tBaJxpKBwgY",
      authDomain: "point-service-c2fcb.firebaseapp.com",
      projectId: "point-service-c2fcb",
      storageBucket: "point-service-c2fcb.appspot.com",
      messagingSenderId: "77473043188",
      appId: "1:77473043188:web:8dc46646d5237291c6c4a1",
      measurementId: "G-MTVG8TYHDG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const profileInfo = document.getElementById("profile-info");
    let currentUserID = null;
    let currentUserData = null;

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[m];
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      currentUserID = user.uid;

      try {
        const docSnap = await getDoc(doc(db, "users", currentUserID));
        currentUserData = docSnap.exists() ? docSnap.data() : {};
        renderProfile(user);
      } catch (err) {
        profileInfo.innerHTML = `<p style="color:red;">⚠️ Failed to load profile</p>`;
        console.error(err);
      }
    });

    function renderProfile(user) {
      const data = currentUserData || {};
      profileInfo.innerHTML = `
        <p><strong>User ID:</strong> ${escapeHtml(currentUserID)}</p>
        <p><strong>Name:</strong> ${escapeHtml(data.name || 'N/A')}</p>
        <p><strong>Email:</strong> ${escapeHtml(user.email)}</p>
        <p><strong>Phone:</strong> ${escapeHtml(data.phone || 'N/A')}</p>
        <p><strong>Address:</strong> ${escapeHtml(data.address || 'N/A')}</p>
        <p><strong>Occupation:</strong> ${escapeHtml(data.occupation || 'N/A')}</p>
        <button id="edit-btn">Edit Profile</button>
      `;

      document.getElementById("edit-btn").addEventListener("click", showEditForm);
    }

    function showEditForm() {
      const data = currentUserData || {};
      profileInfo.innerHTML = `
        <form id="edit-profile-form">
          <p>
            <label for="edit-name">Name:</label>
            <input id="edit-name" type="text" value="${escapeHtml(data.name || '')}" />
          </p>
          <p>
            <label for="edit-phone">Phone:</label>
            <input id="edit-phone" type="tel" value="${escapeHtml(data.phone || '')}" />
          </p>
          <p>
            <label for="edit-address">Address:</label>
            <input id="edit-address" type="text" value="${escapeHtml(data.address || '')}" />
          </p>
          <p>
            <label for="edit-occupation">Occupation:</label>
            <input id="edit-occupation" type="text" value="${escapeHtml(data.occupation || '')}" />
          </p>
          <button id="save-btn" type="submit">Save</button>
          <button id="cancel-btn" type="button">Cancel</button>
        </form>
      `;

      document.getElementById("edit-profile-form").addEventListener("submit", (e) => {
        e.preventDefault();
        saveProfile();
      });

      document.getElementById("cancel-btn").addEventListener("click", () => renderProfile(auth.currentUser));
    }

    async function saveProfile() {
      const updatedUser = {
        name: document.getElementById("edit-name").value.trim(),
        phone: document.getElementById("edit-phone").value.trim(),
        address: document.getElementById("edit-address").value.trim(),
        occupation: document.getElementById("edit-occupation").value.trim()
      };

      try {
        await setDoc(doc(db, "users", currentUserID), updatedUser, { merge: true });
        currentUserData = { ...currentUserData, ...updatedUser };
        alert("✅ Profile updated!");
        renderProfile(auth.currentUser);
      } catch (err) {
        alert("❌ Failed to update profile.");
        console.error(err);
      }
    }

    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "auth.html";
      });
    };
  </script>
</body>
</html>
