<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Review | AZ Service</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Embedded Header -->
  <header class="top-nav">
    <a href="index.html" class="logo" style="text-decoration: none;">
      <div style="text-align: center; line-height: 1;">
        <div style="font-size: 2.2rem; font-weight: bold; color: var(--primary);">1</div>
        <div style="font-size: 0.95rem; color: var(--light);">Point.</div>
      </div>
    </a>

    <div class="nav-links">
      <a href="auth.html" id="signin-link">Sign In</a>
      <a href="profile.html" id="profile-icon" style="display: none;">
        <img src="image/profile-icon.png" alt="Profile" style="width: 30px; height: 30px; border-radius: 50%;" />
      </a>
      <a href="#">Download 1 Point App</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <h2>Leave a Review</h2>
    <form id="review-form" class="form-box" autocomplete="off">
      <div class="form-group">
        <label for="booking-id">Booking ID (optional):</label>
        <input type="text" id="booking-id" name="booking-id" placeholder="Enter your Booking ID" />
      </div>

      <div class="form-group">
        <label for="rating">Rating <span>*</span>:</label>
        <select id="rating" name="rating" required>
          <option value="">-- Select Stars --</option>
          <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
          <option value="4">⭐⭐⭐⭐ - Very Good</option>
          <option value="3">⭐⭐⭐ - Good</option>
          <option value="2">⭐⭐ - Fair</option>
          <option value="1">⭐ - Poor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="feedback">Your Feedback (optional):</label>
        <textarea id="feedback" name="feedback" rows="5" placeholder="Write something..."></textarea>
      </div>

      <button type="submit" class="btn-primary">Submit Review</button>
    </form>
  </main>

  <!-- Embedded Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About Us</a>
      <a href="terms.html">Terms</a>
      <a href="registration.html">Registration</a>
      <a href="contact.html">Contact Us</a>
      <a href="review.html">Reviews</a>
    </div>
    <div class="social">
      <a href="https://wa.me/916009982567" target="_blank">WhatsApp</a> |
      <a href="https://www.instagram.com/1point_service" target="_blank">Instagram</a> |
      <a href="https://www.facebook.com/1point_service" target="_blank">Facebook</a>
    </div>
  </footer>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/916009982567" class="floating-whatsapp" target="_blank">
    <img src="image/whatsapp-icon.png" alt="Chat on WhatsApp" />
  </a>

  <!-- Firebase Review Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIjDHdyokcHvzfzsAc5kK0tBaJxpKBwgY",
      authDomain: "point-service-c2fcb.firebaseapp.com",
      projectId: "point-service-c2fcb",
      storageBucket: "point-service-c2fcb.appspot.com",
      messagingSenderId: "77473043188",
      appId: "1:77473043188:web:8dc46646d5237291c6c4a1",
      measurementId: "G-MTVG8TYHDG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert("\u26a0\ufe0f You must be signed in to leave a review.");
        window.location.href = "auth.html";
      } else {
        currentUser = user;
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("review-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!currentUser) return;

        const bookingId = document.getElementById("booking-id").value.trim();
        const rating = document.getElementById("rating").value;
        const feedback = document.getElementById("feedback").value.trim();

        if (!rating) {
          alert("Please select a rating.");
          return;
        }

        try {
          await addDoc(collection(db, "reviews"), {
            uid: currentUser.uid,
            email: currentUser.email,
            bookingId,
            rating: parseInt(rating),
            feedback,
            createdAt: serverTimestamp()
          });

          alert("✅ Thank you! Your review has been submitted.");
          form.reset();
        } catch (err) {
          console.error("Error submitting review:", err);
          alert("❌ Failed to submit review. Try again later.");
        }
      });
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
