<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reviews – AZ Service</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" />
</head>
<body>
  <!-- Header -->
  <div id="header-container"></div>

  <!-- Main Review Section -->
  <main class="review-page">
    <section class="review-form">
      <h2>Submit a Review</h2>
      <form id="reviewForm">
        <input type="text" id="reviewName" placeholder="Your Name" required />
        <textarea id="reviewMessage" rows="4" placeholder="Write your review..." required></textarea>
        <select id="reviewRating" required>
          <option value="">Rating</option>
          <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
          <option value="4">⭐⭐⭐⭐ - Good</option>
          <option value="3">⭐⭐⭐ - Average</option>
          <option value="2">⭐⭐ - Poor</option>
          <option value="1">⭐ - Terrible</option>
        </select>
        <button type="submit">Post Review</button>
      </form>
    </section>

    <section class="reviews-display">
      <h2>Customer Reviews</h2>
      <ul id="reviewsList"></ul>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIjDHdyokcHvzfzsAc5kK0tBaJxpKBwgY",
      authDomain: "point-service-c2fcb.firebaseapp.com",
      projectId: "point-service-c2fcb",
      storageBucket: "point-service-c2fcb.appspot.com",
      messagingSenderId: "77473043188",
      appId: "1:77473043188:web:8dc46646d5237291c6c4a1",
      measurementId: "G-MTVG8TYHDG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const reviewsRef = collection(db, "az_reviews");

    const reviewForm = document.getElementById("reviewForm");
    const reviewsList = document.getElementById("reviewsList");

    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("reviewName").value.trim();
      const message = document.getElementById("reviewMessage").value.trim();
      const rating = parseInt(document.getElementById("reviewRating").value);

      if (name && message && rating) {
        await addDoc(reviewsRef, {
          name,
          message,
          rating,
          timestamp: serverTimestamp(),
        });

        reviewForm.reset();
        alert("✅ Your review has been submitted!");
      }
    });

    const q = query(reviewsRef, orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      reviewsList.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${data.name}</strong>
          <div>${"⭐".repeat(data.rating)}</div>
          <p>${data.message}</p>
          <hr/>
        `;
        reviewsList.appendChild(li);
      });
    });
  </script>

  <!-- General Script -->
  <script src="script.js"></script>
</body>
</html>
